{% extends "base.html" %}
{% block title %}Ошибка {{ code }} — {{ settings.institution_name }}{% endblock %}
{% block content %}
<div class="mx-auto max-w-xl px-4 py-20 text-center sm:px-6">
  <p class="font-mono text-6xl font-bold text-brand-200">{{ code }}</p>
  <h1 class="mt-4 text-2xl font-semibold text-slate-900">{{ title }}</h1>
  <p class="mt-3 text-slate-600">{{ message }}</p>
  <a href="{{ url_for('public.index') }}"
     class="mt-8 inline-flex items-center gap-2 rounded-xl bg-brand-700 px-5 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-brand-800">
    ← На главную
  </a>
</div>
{% endblock %}
