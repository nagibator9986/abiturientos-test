<!doctype html>
<html lang="ru" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Вход в админ-панель — {{ settings.institution_name }}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f2f43'/><text x='50' y='70' font-size='58' font-family='Georgia,serif' fill='white' text-anchor='middle'>C</text></svg>">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="grid min-h-full place-items-center bg-gradient-to-br from-brand-950 via-brand-900 to-brand-800 p-4">
  <div class="w-full max-w-sm">
    <div class="mb-6 text-center">
      <span class="mx-auto grid h-14 w-14 place-items-center rounded-2xl bg-white/10 font-serif text-2xl font-bold text-white ring-1 ring-inset ring-white/20">C</span>
      <h1 class="mt-4 text-xl font-semibold text-white">{{ settings.institution_name }}</h1>
      <p class="mt-1 text-sm text-brand-200">Панель приёмной комиссии</p>
    </div>

    <form method="post" class="rounded-2xl bg-white p-6 shadow-xl">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ next }}">

      {% if error %}
        <div class="mb-4 rounded-xl border border-rose-200 bg-rose-50 px-4 py-2.5 text-sm text-rose-700">{{ error }}</div>
      {% endif %}

      <label for="username" class="block text-sm font-medium text-slate-700">Логин</label>
      <input id="username" name="username" type="text" required autofocus autocomplete="username"
             class="mt-1.5 mb-4 block w-full rounded-xl border border-slate-300 px-4 py-2.5 outline-none transition focus:border-brand-500 focus:ring-4 focus:ring-brand-100">

      <label for="password" class="block text-sm font-medium text-slate-700">Пароль</label>
      <input id="password" name="password" type="password" required autocomplete="current-password"
             class="mt-1.5 mb-5 block w-full rounded-xl border border-slate-300 px-4 py-2.5 outline-none transition focus:border-brand-500 focus:ring-4 focus:ring-brand-100">

      <button type="submit"
              class="w-full rounded-xl bg-brand-700 px-4 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-brand-800 focus:outline-none focus:ring-4 focus:ring-brand-300">
        Войти
      </button>
    </form>

    <p class="mt-4 text-center text-xs text-brand-300">
      <a href="{{ url_for('public.index') }}" class="transition hover:text-white">← Вернуться к тестированию</a>
    </p>
  </div>
</body>
</html>
